<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Strata">
  <!-- Instagram avatar (1080x1080). Fills the square so the circular crop shows
       solid brand ion; the stacked-strata mark sits in the centre safe zone at
       ~40% width, so no crop can clip it. Mark + colours match components/ui/logo.tsx. -->
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#2a3fd6"/>
      <stop offset="55%" stop-color="#1f34cf"/>
      <stop offset="100%" stop-color="#16249c"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g transform="translate(540,540) scale(27) translate(-11,-11)"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6.5 11 2l8 4.5-8 4.5z" fill="#ffffff"/>
    <path d="M3 11.5 11 16l8-4.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.7"/>
    <path d="M3 15.5 11 20l8-4.5" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.7"/>
  </g>
</svg>
